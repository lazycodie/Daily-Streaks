plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
  namespace 'app.dailystreaks'
  compileSdk 36
  defaultConfig {
    applicationId 'app.dailystreaks'
    minSdk 26
    targetSdk 36
    versionCode 4
    versionName '1.3.0'
  }
  signingConfigs {
    release {
      if (ksFile.exists()) {
        storeFile rootProject.file(ksProps['storeFile'])
        storePassword ksProps['storePassword']
        keyAlias ksProps['keyAlias']
        keyPassword ksProps['keyPassword']
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      debuggable false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      // sign only when a keystore is configured; otherwise build an unsigned release
      if (ksFile.exists()) signingConfig signingConfigs.release
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildFeatures { buildConfig true }
  dependenciesInfo { includeInApk false; includeInBundle false }
}

dependencies {
  implementation 'androidx.activity:activity:1.13.0'
  implementation 'androidx.webkit:webkit:1.18.0'
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
